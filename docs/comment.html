<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コメント</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: -apple-system, 'Hiragino Kaku Gothic ProN', sans-serif; }
  form p { margin: 0 0 10px; }
  textarea { font-size: 16px; }
</style>
</head>
<body>
<!-- satsumaimo.org/manga/nice/nice4_latest に STUDIO の埋め込みで置いていた新都社のコメント欄と同じもの。
     元のタグには新都社メニューの //neetsha.jp/addon/add_menu.js も入っていたが、STUDIO の埋め込みでは
     動いておらず表示されていなかった。ここで動かすと「MENU」ボタンが入力欄に重なるので外している -->
<!-- Neetel_Inside_Comment -->
<script type="text/javascript">
<!--
var comicid = 3681;
-->
</script>
<form action="https://neetsha.jp/inside/comment.php" method="post" target="_top">
<input type="hidden" name="methodid" value="1">
<input type="hidden" name="id" value="3681">
<input type="hidden" name="enc" value="0">
<p>
<textarea name="comment" maxlength="255" style="width:95%; height:2em;" placeholder="コメント"></textarea>
</p>
<p>
<input type="submit" name="submit" value="Send">
</p>
</form>
<!-- Neetel_Inside_Comment -->
<script>
// GA4: コメントを送ったら comment_submit を送る（本文は送らない）。gtag は親ページ（同じドメインの index.html）のもの。
// GA4 はイベントを約5秒ためてから送り、event_callback も送る前に返ってくる。送信で親ページごと新都社へ移ると
// ためた分は送られずに消える（2026-11-28 に Chromium で確認）。gtag は pagehide を受けるとためた分をすぐ送るので、
// イベントを積んだ直後に親ページへ pagehide を投げて吐き出させ、少し待ってから新都社へ送信する。
(() => {
  const form = document.querySelector('form');
  let sending = false;
  form.addEventListener('submit', (e) => {
    if (sending) return;
    let P;
    try { P = window.parent; if (typeof P.gtag !== 'function') return; } catch (_) { return; }
    if (!form.comment.value.trim()) return;
    e.preventDefault();
    sending = true;
    try {
      P.gtag('event', 'comment_submit', typeof P.niceEpisode === 'function' ? P.niceEpisode() : {});
      P.dispatchEvent(typeof P.PageTransitionEvent === 'function'
        ? new P.PageTransitionEvent('pagehide', { persisted: false }) : new P.Event('pagehide'));
    } catch (_) {}
    setTimeout(() => HTMLFormElement.prototype.submit.call(form), 300);
  });
})();
</script>
</body>
</html>
